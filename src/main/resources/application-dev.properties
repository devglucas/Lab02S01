# ===== Perfil DEV: H2 em memoria =====
spring.datasource.url=jdbc:h2:mem:aluguel;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria/atualiza o schema a partir das entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:aluguel)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
